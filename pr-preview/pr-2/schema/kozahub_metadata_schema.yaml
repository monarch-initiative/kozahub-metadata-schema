  ReleaseMetadata:
    name: ReleaseMetadata
    definition_uri: https://w3id.org/monarch/kozahub-metadata/ReleaseMetadata
    description: 'Release-level metadata for a single kozahub ingest build. Captures
      the upstream sources consumed, the artifacts produced, and the versions of the
      source data, ingest code, and dependencies relevant to reproducibility.

      Scope note: this schema describes the *release/build receipt* only. Per-output-file
      content schemas (column-level / data-dictionary metadata derived from the produced
      TSVs) are a separate concern and will live in a sibling schema if added.'
    from_schema: https://w3id.org/monarch/kozahub-metadata
    mappings:
    - schema:Dataset
    exact_mappings:
    - schema:Dataset
    close_mappings:
