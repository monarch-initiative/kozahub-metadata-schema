    - source_version
    - transform_version
    - biolink_version
    - release_version
    - build_version
    - ReleaseMetadata_generated_at
    - sources
    - mappings
    - artifacts
    - tools
    slot_usage:
      source:
        name: source
        required: true
      generated_at:
        name: generated_at
        required: true
    class_uri: schema:Dataset
    tree_root: true
  SourceVersion:
    name: SourceVersion
    definition_uri: https://w3id.org/monarch/kozahub-metadata/SourceVersion
    description: An upstream data source consumed by this ingest, with the version
      observed at retrieval time.
