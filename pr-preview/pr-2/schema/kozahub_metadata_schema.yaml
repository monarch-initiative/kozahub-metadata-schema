    name: MappingVersion
    definition_uri: https://w3id.org/monarch/kozahub-metadata/MappingVersion
    description: "A mapping file (typically SSSOM) consumed by this ingest. Distinct\
      \ from a primary upstream `SourceVersion` because mapping versions have looser\
      \ correctness implications \u2014 divergent mapping versions across contributing\
      \ ingests are typically informational rather than build-breaking. Populated\
      \ primarily by the merging layer (e.g. monarch-ingest) where mappings are applied\
      \ to rewire IDs; individual ingests that consume mapping files for label-lookup\
      \ or similar non-rewiring purposes generally need not populate this."
